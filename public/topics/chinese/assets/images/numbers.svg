<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 100" width="660" height="200" role="img" aria-label="Chinese numbers one to five">
  <g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" text-anchor="middle" fill="#1f2937">
    <g stroke="#4f46e5" stroke-width="2" fill="#e0e7ff">
      <rect x="5" y="5" width="56" height="90" rx="8"/>
      <rect x="71" y="5" width="56" height="90" rx="8"/>
      <rect x="137" y="5" width="56" height="90" rx="8"/>
      <rect x="203" y="5" width="56" height="90" rx="8"/>
      <rect x="269" y="5" width="56" height="90" rx="8"/>
    </g>
    <g font-size="34">
      <text x="33" y="52">一</text><text x="99" y="52">二</text><text x="165" y="52">三</text><text x="231" y="52">四</text><text x="297" y="52">五</text>
    </g>
    <g font-size="13">
      <text x="33" y="80">yī</text><text x="99" y="80">èr</text><text x="165" y="80">sān</text><text x="231" y="80">sì</text><text x="297" y="80">wǔ</text>
    </g>
  </g>
</svg>
