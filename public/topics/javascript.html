<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JavaScript Basics</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><a href="/">📚 Learning Web</a></header>
  <main>
    <h1>⚡ JavaScript Basics</h1>
    <section class="lesson">
      <h2>Variables & functions</h2>
<pre>let name = "Ada";
const add = (a, b) =&gt; a + b;
console.log(add(2, 3)); // 5</pre>
    </section>
    <section class="lesson">
      <h2>Try it</h2>
      <div class="demo">
        <p>Click the button to count:</p>
        <button id="btn">Clicked 0 times</button>
      </div>
    </section>
    <section class="lesson quiz-box">
      <h2>Quiz</h2>
      <div id="quiz" class="quiz" data-quiz='[
        {"q":"Which keyword declares a constant?","options":["var","const","let"],"answer":1},
        {"q":"What does 2 + 3 give?","options":["23","5","error"],"answer":1},
        {"q":"Which prints to the console?","options":["console.log()","print.page()","echo()"],"answer":0}]'></div>
    </section>
  </main>
  <script>
    let n = 0; const b = document.getElementById('btn');
    b.onclick = () => { n++; b.textContent = `Clicked ${n} times`; };
  </script>
  <script src="/js/quiz.js"></script>
</body>
</html>
