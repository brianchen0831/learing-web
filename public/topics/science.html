  <main>
    <h1>💧 The Water Cycle</h1>
    <section class="lesson">
      <h2>Four stages</h2>
      <ol>
        <li><strong>Evaporation</strong> – the sun heats water and it rises as vapour.</li>
        <li><strong>Condensation</strong> – vapour cools and forms clouds.</li>
        <li><strong>Precipitation</strong> – water falls as rain, snow or hail.</li>
        <li><strong>Collection</strong> – water gathers in oceans, rivers and ground.</li>
      </ol>
    </section>
    <section class="lesson quiz-box">
      <h2>Quiz</h2>
      <div id="quiz" class="quiz" data-quiz='[
        {"q":"What turns water into vapour?","options":["Condensation","Evaporation","Collection"],"answer":1},
        {"q":"Clouds form during...","options":["Condensation","Precipitation","Evaporation"],"answer":0},
        {"q":"Rain is an example of...","options":["Precipitation","Evaporation","Condensation"],"answer":0}]'></div>
    </section>
