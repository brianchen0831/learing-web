<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fractions & Percentages</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><a href="/">📚 Learning Web</a></header>
  <main>
    <h1>➗ Fractions & Percentages</h1>
    <section class="lesson">
      <h2>Parts of a whole</h2>
      <p>A fraction like <strong>1/4</strong> means 1 part out of 4 equal parts. As a percentage, multiply by 100: 1/4 = 25%.</p>
    </section>
    <section class="lesson">
      <h2>Try it</h2>
      <div class="demo">
        <input id="n" type="number" value="1" min="0" style="width:4em"> /
        <input id="d" type="number" value="4" min="1" style="width:4em">
        = <strong id="out">25%</strong>
      </div>
    </section>
    <section class="lesson quiz-box">
      <h2>Quiz</h2>
      <div id="quiz" class="quiz" data-quiz='[
        {"q":"1/2 as a percentage?","options":["25%","50%","75%"],"answer":1},
        {"q":"Which is larger?","options":["1/3","1/2","1/4"],"answer":1},
        {"q":"What is 10% of 200?","options":["20","10","2"],"answer":0}]'></div>
    </section>
  </main>
  <script>
    const n = document.getElementById('n'), d = document.getElementById('d'), out = document.getElementById('out');
    function calc() { const v = +d.value; out.textContent = v ? Math.round(n.value / v * 10000) / 100 + '%' : '—'; }
    n.oninput = d.oninput = calc;
  </script>
  <script src="/js/quiz.js"></script>
</body>
</html>
